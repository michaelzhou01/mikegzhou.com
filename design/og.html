<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0a0a0b;overflow:hidden;color:#ecebe6}
  canvas{position:absolute;inset:0}
  .m{font:400 18px "JetBrains Mono",monospace;color:#8b8a84;letter-spacing:.02em}
  .tl{position:absolute;top:44px;left:64px;display:flex;align-items:center;gap:12px;color:#ecebe6}
  .d{width:10px;height:10px;border-radius:50%;background:#d4ff3a;box-shadow:0 0 16px #d4ff3a}
  .tr{position:absolute;top:44px;right:64px}
  .c{position:absolute;left:64px;bottom:64px}
  h1{font:italic 400 64px/1 "Instrument Serif",serif;letter-spacing:-.01em;margin:0 0 16px}
  .t{font:400 20px "JetBrains Mono",monospace;color:#b9b8b2}.t b{color:#d4ff3a;font-weight:400}
  .fig{position:absolute;right:64px;top:44px;text-align:right;line-height:1.7}
  .fig span{color:#4a4a50}
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="m tl"><span class="d"></span>mikegzhou.com</div>

<div class="c"><h1>Mike Zhou</h1><div class="t">engineer · <b>inference infrastructure</b> @ reflection</div></div>
<div class="m fig">fig. 0 — latent space<br><span>16 clusters · 30k points</span></div>
<script>
const x=document.getElementById('c').getContext('2d');
let s=9;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const g=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*r())};
const sph=()=>{const z=r()*2-1,t=r()*6.283,q=Math.sqrt(1-z*z);return[q*Math.cos(t),q*Math.sin(t),z]};
const CX=820,CY=335,R=210,ax=0.6,bx=0.32;
const P=[];
const cen=Array.from({length:16},()=>{const c=sph(),k=.45+r()*.5;return c.map(v=>v*k)});
const kind=cen.map((_,i)=>i===3||i===9?2:i===5||i===12||i===14?3:0);
cen.forEach((c,i)=>{const sg=.05+r()*.07;for(let j=0;j<1500;j++)P.push([c[0]+g()*sg,c[1]+g()*sg,c[2]+g()*sg,kind[i],1.4+r()*1.6])});
for(let j=0;j<5000;j++){const q=sph(),k=1.08;P.push([q[0]*k,q[1]*k,q[2]*k,1,1+r()])}
for(let l=0;l<12;l++){const A=cen[r()*16|0],B=cen[r()*16|0];for(let j=0;j<260;j++){const t=r(),f=1+Math.sin(t*Math.PI)*.35;P.push([(A[0]+(B[0]-A[0])*t)*f,(A[1]+(B[1]-A[1])*t)*f,(A[2]+(B[2]-A[2])*t)*f,0,1.1])}}
const col={0:[236,235,230],1:[236,235,230],2:[212,255,58],3:[106,227,255]};
const pr=P.map(([X,Y,Z,k,sz])=>{let a=ax,b=bx;let x1=X*Math.cos(a)+Z*Math.sin(a),z1=-X*Math.sin(a)+Z*Math.cos(a);let y2=Y*Math.cos(b)-z1*Math.sin(b),z2=Y*Math.sin(b)+z1*Math.cos(b);const p=2.8/(2.8+z2);return[CX+x1*R*p,CY-y2*R*p,z2,k,sz*p]}).sort((a,b)=>b[2]-a[2]);

for(const[px,py,z,k,sz]of pr){const near=Math.min(1,Math.max(0,1-(z+1.1)/2.2));const al=(k===1?.16:.5)*(.28+.72*near);const c=col[k];x.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${al})`;x.beginPath();x.arc(px,py,sz*.55,0,7);x.fill()}
</script></body></html>
